<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .logo-card {
      width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 60px 40px;
      background: #000;
    }

    .icon-box {
      width: 340px;
      height: 340px;
      background: #C41E1E;
      border-radius: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 180px;
    }

    .brand-name {
      text-align: center;
      line-height: 1.15;
    }

    .brand-name span {
      display: block;
      font-size: 56px;
      font-weight: 400;
      color: #fff;
      letter-spacing: -1px;
    }

    .brand-name strong {
      display: block;
      font-size: 56px;
      font-weight: 800;
      color: #C41E1E;
      letter-spacing: -1px;
    }

    hr {
      width: 100%;
      border: none;
      border-top: 2px solid #222;
    }

    .contact {
      text-align: center;
      color: #9CA3AF;
      font-size: 20px;
      line-height: 1.8;
    }

    .contact strong {
      display: block;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="logo-card">
    <div class="icon-box">
      <i class="fa-solid fa-house-chimney"></i>
    </div>

    <div class="brand-name">
      <span>Residencias</span>
      <strong>Costa Rica</strong>
    </div>

    <hr/>

    <div class="contact">
      <strong>Floribeth Elizondo</strong>
      Asesora Inmobiliaria<br/>
      +506 8372-5603<br/>
      residenciascostarica.com
    </div>
  </div>
</body>
</html>
