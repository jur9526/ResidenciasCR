name: Sync Encuentra24

on:
  schedule:
    - cron: '0 15 * * *'   # 9:00 AM Costa Rica (UTC-6)
  workflow_dispatch:         # Permite correrlo manualmente desde GitHub
    inputs:
      full_scan:
        description: 'Recorrer todas las páginas del perfil'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Necesario para hacer push al repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests Pillow
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # Cloudflare bloquea las IPs de GitHub: las páginas se piden vía ScraperAPI
      - name: Run sync script
        run: python3 sync_encuentra24.py
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          FULL_SCAN: ${{ inputs.full_scan && '1' || '' }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add properties-data.js assets/
          git diff --staged --quiet && echo "Sin cambios" || (
            git commit -m "Auto-sync: actualizar propiedades desde Encuentra24 [$(date +'%Y-%m-%d')]"
            git push
          )
        if: always()  # guardar lo descargado aunque alguna propiedad haya fallado
