name: Sync Propiedades Encuentra24

on:
  schedule:
    - cron: '0 13 * * *'  # 7:00 AM Costa Rica (UTC-6)
  workflow_dispatch:       # permite correrlo manualmente desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Correr sync
        run: python3 sync_encuentra24.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add properties-data.js assets/
          git diff --cached --quiet || git commit -m "Auto-sync propiedades $(date +'%Y-%m-%d')"
          git push
